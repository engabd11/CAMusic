# Gradle 9.5 + AGP 9.3. The three below are all off by default and all free here.
#
# configuration-cache is the largest single incremental-build win available: Gradle 9
# has it stable and AGP 9 supports it, and it skips the configuration phase entirely
# on any build whose inputs have not changed.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# 2048m was low for Gradle 9 + AGP 9 + KSP + Room + the Compose compiler over a
# multi-thousand-file module; the daemon spent time in GC that it did not have to.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# android.enableR8.fullMode was here and is gone: it has been the default since
# AGP 8.0, so it only said what was already true.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
