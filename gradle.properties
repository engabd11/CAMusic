org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# AGP 9 migration — opt out of new DSL interfaces temporarily.
# This keeps the old BaseExtension-based DSL working during the transition.
# Remove when all plugins and build logic are confirmed compatible with the new DSL.
# The opt-out is removed in AGP 10.0 (mid-2026).
android.newDsl=false
# Opt out of built-in Kotlin — keep declaring org.jetbrains.kotlin.android explicitly.
android.builtInKotlin=false
