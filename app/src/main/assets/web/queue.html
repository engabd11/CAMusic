<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAMusic Queue</title>
<style>
body { margin: 0; background: #0a0a0a; color: #e0e0e0; font-family: system-ui, sans-serif; }
.header { padding: 16px; text-align: center; }
.header h1 { font-size: 18px; margin: 0; opacity: 0.7; }
.search { padding: 0 16px 12px; }
.search input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #333;
  border-radius: 8px; background: #1a1a1a; color: #e0e0e0; box-sizing: border-box; }
.queue { list-style: none; padding: 0 16px; margin: 0; }
.queue li { padding: 12px 0; border-bottom: 1px solid #1a1a1a; display: flex; align-items: center; }
.queue li .info { flex: 1; }
.queue li .title { font-size: 14px; }
.queue li .artist { font-size: 12px; opacity: 0.5; }
.queue li .remove { background: none; border: none; color: #ff6b6b; cursor: pointer; padding: 8px; }
.add-btn { display: block; width: calc(100% - 32px); margin: 8px 16px; padding: 14px;
  font-size: 16px; border: none; border-radius: 8px; background: #3DDC84; color: #000; cursor: pointer; }
</style>
</head>
<body>
<div class="header"><h1>CAMusic Queue</h1></div>
<div class="search"><input id="search" placeholder="Search for a track to add..." autocomplete="off"></div>
<button class="add-btn" id="addBtn">Add to queue</button>
<ul class="queue" id="queue"></ul>
<script>
let ws = null;
let socketUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';

function connect() {
  ws = new WebSocket(socketUrl);
  ws.onmessage = function(e) {
    const state = JSON.parse(e.data);
    renderQueue(state.tracks || [], state.currentIndex);
  };
  ws.onclose = function() { setTimeout(connect, 2000); };
}

function renderQueue(tracks, currentIndex) {
  const list = document.getElementById('queue');
  list.innerHTML = '';
  tracks.forEach(function(t, i) {
    const li = document.createElement('li');
    li.innerHTML = '<div class="info"><div class="title">' + t.title +
      '</div><div class="artist">' + t.artist + '</div></div>';
    if (i !== currentIndex) {
      const btn = document.createElement('button');
      btn.className = 'remove'; btn.textContent = 'Remove'; btn.dataset.idx = i;
      btn.onclick = function() { ws.send(JSON.stringify({ index: i })); };
      li.appendChild(btn);
    }
    list.appendChild(li);
  });
}

document.getElementById('addBtn').onclick = function() {
  const input = document.getElementById('search');
  const title = input.value.trim();
  if (!title || !ws) return;
  ws.send(JSON.stringify({ title: title, artist: 'Unknown' }));
  input.value = '';
};

connect();
</script>
</body>
</html>
