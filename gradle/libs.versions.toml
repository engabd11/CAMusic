# One place for every dependency and plugin version.
#
# The *reasons* for a version (pins, "never 1.11.0", alpha overrides) stay as comments
# next to where each library is used in app/build.gradle.kts, because that is where
# someone changing it will be looking. This file only holds the numbers, so a version
# used twice (coroutines, media3, material3, Room) can no longer drift apart.

[versions]
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.6"
room = "2.8.5"
baselineprofile = "1.5.0"
oboe = "1.10.0"
compose-bom = "2026.09.00"
material3 = "1.5.0-alpha29"
core-ktx = "1.19.1"
lifecycle = "2.10.0"
activity-compose = "1.13.0"
navigation-compose = "2.10.2"
material-components = "1.12.0"
okhttp = "4.12.0"
serialization-json = "1.7.3"
coroutines = "1.9.0"
coil = "2.7.0"
profileinstaller = "1.4.1"
datastore = "1.2.1"
glance = "1.1.1"
media3 = "1.11.1"
librespot = "1.6.5"
slf4j-android = "2.0.16-0"
protobuf-java = "3.25.9"
tv-material = "1.1.0"
junit = "4.13.2"
androidx-test-ext-junit = "1.3.0"
androidx-test-core = "1.7.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"
uiautomator = "2.4.0"
benchmark-macro = "1.5.0"

[libraries]
oboe = { module = "com.google.oboe:oboe", version.ref = "oboe" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
