name: Build APK

# Builds the debug APK for a branch and uploads it as a workflow artifact, so a
# branch can be checked for compile errors before anything is released.
#
# This workflow deliberately does NOT publish releases. "debug keystore" is not one
# shared key: each machine generates its own at ~/.android/debug.keystore, and a CI
# runner starts empty, so every run signs with a brand-new throwaway key. Android
# refuses to update an installed app whose signer changed — "package conflicts with
# an existing package" — so a CI-signed APK cannot install over a locally-signed one.
#
# That is exactly what broke v0.2.5: it was the first CI-published release, signed
# 03cdee29… while v0.1.0-v0.2.4 were all built locally and signed 21b01f0f….
#
# Releases are therefore cut locally, where the keystore is stable:
#
#     ./gradlew assembleMobileRelease assembleTvRelease
#     gh release create vX.Y.Z --prerelease \
#       --title "$(head -n1 docs/release-notes/vX.Y.Z.md)" \
#       --notes-file <(tail -n +2 docs/release-notes/vX.Y.Z.md) \
#       app/build/outputs/apk/mobile/release/app-mobile-release.apk#camusic-vX.Y.Z-mobile.apk \
#       app/build/outputs/apk/tv/release/app-tv-release.apk#camusic-vX.Y.Z-tv.apk
#
# (the #label suffix renames the uploaded asset - both release APKs are otherwise
# named app-*-release.apk and easy to grab the wrong one of when sideloading.)
#
# To publish from CI instead, commit a dedicated keystore to GitHub Actions secrets
# and add a signingConfig that uses it, so every build — local and CI — shares one
# key. Until then, keep publishing local.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # assembleDebug never touches the test sources, so a branch could go green
      # with tests that don't even compile. Run them here too.
      - name: Run unit tests
        run: |
          ./gradlew :app:testMobileDebugUnitTest
          ./gradlew :app:testTvDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew assembleMobileDebug assembleTvDebug

      - name: Name the APKs
        id: name
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "dist/sendspin-${version}-mobile-debug.apk"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "dist/sendspin-${version}-tv-debug.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sendspin-${{ steps.name.outputs.version }}-debug-${{ github.sha }}
          path: dist/*.apk
