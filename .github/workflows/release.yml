name: Release APK

# Builds the installable debug APK and, for a `v*` tag, publishes it as a
# prerelease. Debug rather than release on purpose: the release build is minified
# and unsigned, so it cannot be installed on a phone without a signing key, while
# the debug build is signed with the standard debug keystore and installs directly.
#
# Feature branches build too (artifact only, no release), so a branch can be
# checked for compile errors — and its APK downloaded — before anything is tagged.
on:
  push:
    branches: ['claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Name the APK
        id: name
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/sendspin-${version}-debug.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sendspin-${{ steps.name.outputs.version }}-debug
          path: dist/*.apk

      # Release notes live in the repo so a tag carries a written changelog rather
      # than a list of commit subjects. First line is the release title.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            title=$(head -n 1 "$notes")
            tail -n +2 "$notes" > /tmp/release-body.md
            gh release create "$GITHUB_REF_NAME" \
              --prerelease --title "$title" --notes-file /tmp/release-body.md \
              dist/*.apk
          else
            gh release create "$GITHUB_REF_NAME" \
              --prerelease --generate-notes \
              dist/*.apk
          fi
