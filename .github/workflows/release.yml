name: Build APK

# Builds the debug APK for a branch and uploads it as a workflow artifact, so a
# branch can be checked for compile errors before anything is released.
#
# This workflow deliberately does NOT publish releases. Releases are signed with the
# release key and a rotation lineage kept in ~/.camusic-signing on the release machine
# (see docs/signing.md), and neither is given to CI. Without them the release build
# stays signed with a throwaway debug key, which Android refuses as an update —
# exactly what broke v0.2.5, the one CI-published release.
#
# Releases are therefore cut locally, where the key is:
#
#     ./gradlew assembleMobileRelease assembleTvRelease
#     gh release create vX.Y.Z --prerelease \
#       --title "$(head -n1 docs/release-notes/vX.Y.Z.md)" \
#       --notes-file <(tail -n +2 docs/release-notes/vX.Y.Z.md) \
#       app/build/outputs/apk/mobile/release/app-mobile-release.apk#camusic-vX.Y.Z-mobile.apk \
#       app/build/outputs/apk/tv/release/app-tv-release.apk#camusic-vX.Y.Z-tv.apk
#
# (the #label suffix renames the uploaded asset - both release APKs are otherwise
# named app-*-release.apk and easy to grab the wrong one of when sideloading.)
#
# Check the APK's signer is CN=CAMusic before uploading (docs/signing.md).
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # lfs: the bundled speed-zone database is an LFS object. Without this the
      # runner checks out its pointer file, and mergeAssets fails trying to
      # gunzip 130 bytes of text: "Not in GZIP format".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      # assembleDebug never touches the test sources, so a branch could go green
      # with tests that don't even compile. Run them here too.
      - name: Run unit tests
        run: |
          ./gradlew :app:testMobileDebugUnitTest
          ./gradlew :app:testTvDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew assembleMobileDebug assembleTvDebug

      - name: Name the APKs
        id: name
        run: |
          set -euo pipefail
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/mobile/debug/app-mobile-debug.apk "dist/sendspin-${version}-mobile-debug.apk"
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk "dist/sendspin-${version}-tv-debug.apk"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sendspin-${{ steps.name.outputs.version }}-debug-${{ github.sha }}
          path: dist/*.apk
