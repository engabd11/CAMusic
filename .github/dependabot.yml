# Weekly proposals for the build's dependencies and the CI actions, grouped so a
# week is one or two PRs rather than a dozen. Nothing merges on its own.
#
# Pins that carry a reason stay pinned: an update Dependabot proposes is still
# checked against the comment beside the version (media3 1.11.1 and never 1.11.0,
# for one — see gradle/libs.versions.toml) before anyone merges it.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["androidx.*", "org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
